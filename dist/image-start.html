<!doctype html><html lang="ko" data-entry-screen="character"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>퀘스트 v3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: calm card UI (gray canvas, white cards, one big heading per screen) for a personal life-RPG
   with a Threads-style social layer. Tabs: 오늘 · 성장 · 기록 · 피드 · 프로필. */
:root{
  --bg:#F2F4F3; --card:#FFFFFF; --ink:#18201C; --sub:#4E5853; --muted:#6F7974; --line:#E4E8E6; --fill:#F2F4F3; --seg:#E3E8E5;
  --accent:#12A374; --accent-ink:#FFFFFF; --accent-soft:#E3F6EE;
  --xp:#E28B00; --xp-soft:#FFF3DC; --gold:#C98A00; --heart:#F0445E; --done:#12A374; --warn:#E5503A; --violet:#7B5BD6; --violet-soft:#EFEAFD;
  --f:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:22px; --chk:#C3CCC7; --track:#E3E8E5; --sbt:#D5DBD8; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1211; --card:#1B201E; --ink:#EDF1EF; --sub:#B5BEB9; --muted:#7D8883; --line:#2A312E; --fill:#252B28; --seg:#232926;
  --accent:#2FC08E; --accent-ink:#04231A; --accent-soft:#133227;
  --xp:#FFB23F; --xp-soft:#33280F; --gold:#FFC861; --heart:#FF5C74; --done:#2FC08E; --warn:#FF7A62; --violet:#A98CFF; --violet-soft:#2A2340; --chk:#4A534F; --track:#2E3532; --sbt:#3A423E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1211; --card:#1B201E; --ink:#EDF1EF; --sub:#B5BEB9; --muted:#7D8883; --line:#2A312E; --fill:#252B28; --seg:#232926;
  --accent:#2FC08E; --accent-ink:#04231A; --accent-soft:#133227;
  --xp:#FFB23F; --xp-soft:#33280F; --gold:#FFC861; --heart:#FF5C74; --done:#2FC08E; --warn:#FF7A62; --violet:#A98CFF; --violet-soft:#2A2340; --chk:#4A534F; --track:#2E3532; --sbt:#3A423E; color-scheme:dark}

*{box-sizing:border-box}
.difficulty-selector .opt .e{display:flex;align-items:center;flex:none}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:16px;line-height:1.55;letter-spacing:-.2px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
body.has-replybar{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.col{max-width:540px;margin:0 auto}
[hidden]{display:none!important}
.num{font-variant-numeric:tabular-nums}
html,*{scrollbar-color:var(--sbt) var(--card)}
::-webkit-scrollbar{width:10px;height:10px;background:var(--card)}
::-webkit-scrollbar-track{background:var(--card)}
::-webkit-scrollbar-thumb{background:var(--sbt);border-radius:10px;border:2px solid var(--card)}
::-webkit-scrollbar-corner{background:var(--card)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:0 max(16px,env(safe-area-inset-left,0px))}
.top .col{display:flex;align-items:center;gap:8px;height:56px}
.top h1{margin:0;font-size:19px;font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 .logo{letter-spacing:1px}
.iconbtn{border:0;background:none;padding:8px;display:grid;place-items:center;border-radius:12px;color:var(--ink);position:relative}
.iconbtn.back{margin-left:-8px}
.iconbtn svg{width:24px;height:24px}
.nav .navtog{display:none}
.goldchip{display:inline-flex;align-items:center;gap:4px;background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--gold)}
.dot{position:absolute;top:6px;right:6px;min-width:16px;height:16px;border-radius:8px;background:var(--heart);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}

.hello{font-size:24px;line-height:1.38;font-weight:800;margin:8px 4px 2px;text-wrap:balance}
.hello em{font-style:normal;color:var(--accent)}
.hello small{display:block;font-size:14px;font-weight:500;color:var(--muted);margin-bottom:2px}
.stack{display:flex;flex-direction:column;gap:12px}
.banner{font-size:14px;color:var(--sub);background:var(--card);border-radius:16px;padding:14px 16px;margin:0}

.card{background:var(--card);border-radius:var(--r);padding:22px 20px}
.card.tight{padding:8px 0}
.card.flush{padding:6px 0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px}
.ch h2{font-size:18px;font-weight:700;margin:0}
.ch .side{font-size:14px;color:var(--muted);font-weight:500}
.ch .side.btnlink{border:0;background:none;color:var(--accent);font-weight:700;padding:0}
.card.tight .ch{padding:14px 20px 0;margin-bottom:4px}

/* character */
.char{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.char .stage{width:84px;height:84px;border-radius:20px;background:var(--fill);display:grid;place-items:center;position:relative}
.char .stage .sprite,.char .stage .chibi{animation:bob 2.4s ease-in-out infinite}
.chibi{position:relative;display:block;flex:none}
.chibi svg{position:absolute;inset:0;width:100%;height:100%}
.chibi .cface{position:absolute;left:19%;top:3%;width:62%;height:62%;border-radius:50%;overflow:hidden;background:var(--fill);box-shadow:0 0 0 max(1.5px,4%) #fff, 0 2px 6px rgba(0,0,0,.18)}
.chibi .cface img{width:100%;height:100%;object-fit:cover;display:block}
.av .chibi{margin-top:6%}
.obstage{display:grid;place-items:center;margin:0 auto 14px;width:168px;height:168px;border-radius:32px;background:var(--fill);position:relative;overflow:hidden}
.obstage .chibi{animation:bob 2.4s ease-in-out infinite}
.avatar-fullbody{display:inline-grid;place-items:center;flex:none;max-width:100%}
.avatar-fullbody img{display:block;width:100%;height:100%;object-fit:contain}
.obmaking{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:10px;background:color-mix(in srgb,var(--fill) 88%,transparent);font-size:13px;font-weight:700;color:var(--sub);text-align:center}
.obmaking i{width:30px;height:30px;border-radius:50%;border:3px solid color-mix(in srgb,var(--accent) 25%,transparent);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.facebtns{display:flex;gap:8px;justify-content:center;margin-bottom:6px;flex-wrap:wrap}
.facehint{font-size:12px;color:var(--muted);text-align:center;margin:0 0 16px;line-height:1.5}
.char .job{position:absolute;right:-6px;bottom:-6px;width:30px;height:30px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:16px;box-shadow:0 2px 6px rgb(0 0 0 / .12)}
.char h2{font-size:20px;font-weight:800;margin:0;line-height:1.25;overflow-wrap:anywhere}
.char p{margin:2px 0 8px;font-size:14px;color:var(--muted)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.statrow div{background:var(--fill);border-radius:14px;padding:10px 6px;text-align:center}
.statrow b{display:block;font-size:18px;font-weight:800}
.statrow b.g{color:var(--gold)}
.statrow span{font-size:12px;color:var(--muted)}
@keyframes bob{50%{transform:translateY(-3px)}}

.pillLv{display:inline-block;background:var(--xp-soft);color:var(--xp);font-weight:700;font-size:12px;border-radius:6px;padding:0 6px;margin-left:5px;vertical-align:1px;line-height:18px;white-space:nowrap}
.bar{display:block;height:8px;background:var(--track);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--xp);border-radius:4px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.bar.green i{background:var(--done)}
.barmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:5px}
.btnrow{display:flex;gap:8px;margin-top:18px}
.btnrow.pacts{margin-top:0}
.btnrow.pacts .btn{flex:1}
.btnrow.pacts .btn.sec{background:var(--card)}
.btnrow .btn{flex:1}

.av{display:grid;place-items:center;border-radius:50%;background:var(--fill);overflow:hidden;flex:none;border:0;padding:0;position:relative}
.sprite{display:block}

.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);white-space:nowrap;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--fill);color:var(--ink)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.sm{padding:8px 14px;font-size:14px;border-radius:12px}
.btn.xs{padding:5px 10px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn.big{padding:17px 18px;font-size:17px;border-radius:16px}
.btn.gold{background:var(--xp-soft);color:var(--gold)}
.btn:disabled{opacity:.35;cursor:not-allowed;transform:none}
.btn .x{font-size:13px;opacity:.85;margin-left:6px;font-weight:500}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:14px;font-weight:500}

.row{display:flex;align-items:center;gap:14px;padding:12px 20px;border:0;background:none;width:100%;text-align:left;min-width:0}
button.row:active,[role=button].row:active{background:var(--fill)}
.row .ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--fill);flex:none;font-size:19px;color:var(--muted);font-weight:800}
.row .ic.sq{border-radius:14px;white-space:nowrap;letter-spacing:-.4px;width:auto;min-width:42px;padding:0 6px;box-sizing:border-box}
.row.nested .ic.sq{min-width:32px;width:auto;padding:0 5px;border-radius:10px;font-size:12px!important}
.row .ic.gold{background:var(--xp-soft);color:var(--xp)}
.row .ic.ok{background:var(--accent-soft);color:var(--accent)}
.row .t{flex:1;min-width:0}
.task-meta .tday,.wtx .tday,.mtx .tday,.titem .tday,.rt .tday,.cap .tday{white-space:nowrap;flex:none;align-self:flex-start}
.row .t small.task-meta{display:flex;align-items:center;flex-wrap:wrap;gap:4px;overflow:visible;white-space:normal}
.row .t b{display:block;font-weight:500;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t b.done{color:var(--muted);text-decoration:line-through}
.row .t small{display:block;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t .bar{margin-top:7px;height:5px}
.row .r{font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;text-align:right}
.row .r.on{color:var(--accent)}
.row.nested{padding-left:44px}
.row.nested .ic{width:32px;height:32px}
.row.new{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
.chev{color:var(--muted);flex:none}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--chk);background:var(--card);flex:none;display:grid;place-items:center;color:transparent;padding:0;transition:transform .12s}
.check.on{background:var(--done);border-color:var(--done);color:#fff}
.check svg{width:16px;height:16px}
.lvb{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:700;border-radius:6px;padding:0 6px;line-height:19px;margin-right:4px}
.lvb.bronze{background:#F6E9DD;color:#9A5B2A}.lvb.silver{background:#ECEFF2;color:#5E6A75}.lvb.gold{background:#FFF1CC;color:#A77700}.lvb.diamond{background:#E3F0FF;color:#2C6CC4}.lvb.gm{background:#FFE5E8;color:#C22E45}
.fire{color:var(--sub);font-weight:700}
.fire svg,.fire .ei{color:var(--warn)}
.empty-row{padding:6px 20px 16px;font-size:14px;color:var(--muted)}
.addline{display:flex;gap:8px;padding:6px 20px 14px}
.addline input{flex:1;min-width:0;padding:10px 14px!important;font-size:15px!important}

.segwrap{position:relative}
.helpdot{position:absolute;top:-10px;right:-6px;z-index:2;width:24px;height:24px;border-radius:50%;border:0;background:var(--card);color:var(--muted);display:grid;place-items:center;padding:0;cursor:pointer}
.helpdot svg{width:20px;height:20px}
.helplist{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.helpitem{background:var(--fill);border-radius:14px;padding:13px 14px;border:1.5px solid transparent}
.helpitem.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 8%,var(--card))}
.helpitem b{display:block;font-size:15px;font-weight:800;margin-bottom:4px}
.helpitem p{margin:0;font-size:13px;line-height:1.55;color:var(--sub)}
.helpitem ul{margin:6px 0 0;padding-left:16px;font-size:13px;line-height:1.6;color:var(--sub)}
.seg{display:flex;background:var(--seg);border-radius:12px;padding:4px;gap:4px;border:1.5px solid color-mix(in srgb,var(--ink) 22%,transparent)}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--accent);box-shadow:0 0 0 1.5px var(--accent),0 1px 4px rgb(0 0 0 / .08)}
.seg button:disabled{opacity:.4}

/* planner */
.cond{display:flex;align-items:center;gap:12px}
.cond input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:6px;border-radius:3px;margin:11px 0;background:linear-gradient(var(--accent),var(--accent)) 0 0/var(--p,50%) 100% no-repeat,var(--track);outline-offset:6px}
.cond input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--card);border:2px solid var(--accent);box-shadow:0 1px 4px rgb(0 0 0 / .18);cursor:pointer}
.cond input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--accent);box-shadow:0 1px 4px rgb(0 0 0 / .18);cursor:pointer}
.cond input[type=range]::-moz-range-track{background:transparent}
.cond b{font-size:20px;font-weight:800;min-width:56px;text-align:right}
.emos{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.emos button{border:0;background:var(--fill);border-radius:12px;padding:7px 10px;font-size:14px;display:flex;align-items:center;gap:4px;color:var(--sub)}
.emos button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700;box-shadow:inset 0 0 0 2px var(--accent)}
.diary-done{display:flex;gap:12px;align-items:flex-start}
.diary-done .em{font-size:30px;line-height:1}
.diary-done p{margin:2px 0 0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--sub);margin:10px 0 14px}
.toggle input{-webkit-appearance:none;appearance:none;flex:none;width:20px;height:20px;margin:0;border:2px solid var(--chk);border-radius:6px;background:var(--card);display:inline-grid;place-items:center;cursor:pointer}
.toggle input:checked{background:var(--accent);border-color:var(--accent)}
.toggle input:checked::after{content:"";width:9px;height:5px;border:2.2px solid #fff;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}

/* compose prompt */
.prompt{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);border-radius:var(--r);padding:16px 18px;text-align:left}
.prompt .t{flex:1;min-width:0}
.prompt .t b{display:block;font-size:15px;font-weight:700}
.prompt .t span{display:block;font-size:15px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prompt .go{background:var(--accent);color:var(--accent-ink);border-radius:12px;padding:8px 14px;font-size:14px;font-weight:700;flex:none}

/* feed post */
.tp{display:grid;grid-template-columns:40px 1fr;column-gap:8px;padding:0 20px 0 14px;position:relative}
.tp .rail{display:flex;flex-direction:column;align-items:center}
.tp .rail .ln{flex:1;width:2px;background:var(--line);border-radius:1px;margin:6px 0 -14px;min-height:12px}
.tp .body{min-width:0;padding-bottom:14px}
.tp + .tp{padding-top:14px}
.feedcard{padding:18px 0 4px}
.ph{display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.3;min-height:22px}
.ph .nm{border:0;background:none;padding:0;font-weight:700;font-size:15px;text-align:left;overflow-wrap:anywhere}
.ph .jobi{font-size:13px}
.ph time{font-size:14px;color:var(--muted)}
.ph .fol{margin-left:auto;flex:none}
.ref{display:flex;align-items:center;gap:8px;margin-top:8px;max-width:100%;border:0;border-radius:12px;padding:8px 12px;text-align:left;font-size:13.5px;min-width:0;background:var(--fill);color:var(--sub)}
.ref .ri{font-size:16px;flex:none}
.ref .rt{flex:1;min-width:0;line-height:1.35}
.ref .rt b{display:block;color:var(--ink);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref .rt small{display:block;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ref.quest{background:color-mix(in srgb,var(--warn) 9%,var(--card))}
.ref.done{background:var(--xp-soft)}
.ref.diary{background:var(--violet-soft)}
.ref .join{flex:none}
.mood{display:inline-block;margin-top:8px;font-size:13px;font-weight:500;background:var(--fill);color:var(--sub);border-radius:8px;padding:2px 9px}
.txtwrap{position:relative}
.txt{margin:6px 0 0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.6;cursor:pointer;touch-action:manipulation}
.focus .txt{font-size:18px;cursor:default}
.qa{margin:10px 0 0;font-size:13px;font-weight:700;color:var(--accent);display:flex;gap:6px}
.qa::before{content:"Q";display:grid;place-items:center;width:18px;height:18px;border-radius:5px;background:var(--accent-soft);font-size:12px;flex:none;margin-top:1px}
.qa + .txtwrap .txt{margin-top:2px}
.media{position:relative;margin-top:10px;touch-action:manipulation}
.car{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car .pimg{flex:0 0 100%;scroll-snap-align:start;aspect-ratio:1;background:var(--fill);border-radius:14px;overflow:hidden;max-width:100%}
.car.multi .pimg{flex-basis:76%}
.car img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
.burst{position:absolute;left:50%;top:50%;width:84px;height:84px;margin:-42px 0 0 -42px;color:#fff;pointer-events:none;opacity:0;filter:drop-shadow(0 4px 14px rgb(0 0 0 / .3))}
.txtwrap .burst{width:56px;height:56px;margin:-28px 0 0 -28px;color:var(--heart)}
.burst.go{animation:burst .9s cubic-bezier(.2,.9,.3,1.3)}
@keyframes burst{0%{opacity:0;transform:scale(.3)}15%{opacity:1;transform:scale(1.15)}30%{transform:scale(.95)}45%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-16px)}}
.acts{display:flex;gap:2px;margin:8px 0 0 -8px}
.ab{border:0;background:none;border-radius:999px;padding:7px 9px;display:inline-flex;align-items:center;gap:5px;color:var(--sub);font-size:14px;font-weight:500}
.ab:hover{background:var(--fill)}
.ab:active{transform:scale(.92)}
.ab svg{width:21px;height:21px}
.ab.on{color:var(--heart)}
.ab.on svg{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.3)}}
.xpop{position:fixed;z-index:95;transform:translateY(-50%);pointer-events:none;font-size:12.5px;font-weight:800;color:var(--gold);background:var(--card);border-radius:999px;padding:3px 9px;box-shadow:0 2px 8px rgb(0 0 0 / .12);white-space:nowrap;animation:xpop 1s ease-out forwards}
@keyframes xpop{0%{opacity:0;transform:translate(-4px,-50%)}15%{opacity:1;transform:translate(0,-50%)}75%{opacity:1}100%{opacity:0;transform:translate(0,-90%)}}
@media (prefers-reduced-motion:reduce){.xpop{animation:none}}

.metric .mv em.bad{color:var(--warn);background:color-mix(in srgb,var(--warn) 12%,transparent)}

/* stories, caught-up, pill */

/* replies */
.reply{display:grid;grid-template-columns:36px 1fr;column-gap:10px;padding:14px 20px 0;position:relative}

/* project */
.thead h2{font-size:24px;line-height:1.3;font-weight:800;margin:12px 0 6px;text-wrap:balance;overflow-wrap:anywhere}

.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;font-weight:700;border-radius:8px;padding:3px 9px;background:var(--fill);color:var(--sub)}

.scrim{position:fixed;inset:0;z-index:50;background:rgb(0 0 0 / .45);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}

.sheet{background:var(--card);width:min(520px,100%);max-height:calc(100dvh - 32px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;border-radius:24px;
  padding:22px 22px 20px;box-shadow:0 20px 60px rgb(0 0 0 / .25);animation:up .24s cubic-bezier(.2,.8,.2,1)}

    for (const [u,t] of Object.entries(p.joiners||{})) if (on(t) && u !== S.me) out.push({type:"join", who:u, at:t, p}); }
  for (const c of Object.values(S.replies)){
    const p = S.feed[c.postId]; if (!p) continue; const parent = c.parentId && S.replies[c.parentId];
    if (c.author !== S.me && (p.author === S.me || (parent && parent.author === S.me))) out.push({type:"reply", who:c.author, text:c.text, at:c.createdAt, p, toMe:!!(parent && parent.author === S.me)});
